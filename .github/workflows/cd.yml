name: CD - Publicación Continua de Imagen API en GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publicar-imagen-ghcr:
    runs-on: ubuntu-latest
    env:
      MODEL_LOCAL_PATH: tests/fixtures/modelo_champion
      GUARDAR_SNOWFLAKE: "false"
      MODO_RESPALDO: "false"
      TOKEN_ADMIN: token-prueba-ci

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y verificar pruebas antes de desplegar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests -v

      - name: Iniciar sesión en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen con tag del commit SHA y latest
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${OWNER_LC}/proyecto_final-api"
          docker build -f api/Dockerfile \
            -t "${IMAGE_BASE}:${{ github.sha }}" \
            -t "${IMAGE_BASE}:latest" .
          docker push "${IMAGE_BASE}:${{ github.sha }}"
          docker push "${IMAGE_BASE}:latest"
