name: CD - Publicación Continua de Imagen API en GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publicar-imagen-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MODEL_LOCAL_PATH: tests/fixtures/modelo_champion
      GUARDAR_SNOWFLAKE: "false"
      MODO_RESPALDO: "false"
      TOKEN_ADMIN: token-prueba-ci

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y verificar pruebas antes de desplegar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests -v

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen en GHCR con commit SHA y latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/oedwinher/proyecto_final-api:${{ github.sha }}
            ghcr.io/oedwinher/proyecto_final-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/oedwinher/proyecto_final
            org.opencontainers.image.revision=${{ github.sha }}
