# Proyecto Final (PSets #1 a #4) - Arquitectura MLOps End-to-End Unificada:
# Kestra (8080) + Spark Master/Worker (8081/8082/7077) + MLflow Registry (5000) +
# API FastAPI de Inferencia (8000) + Tablero Streamlit de Monitoreo (8501) +
# Jobs bajo demanda con --profile jobs (dbt y spark-submit).
#
#   docker compose up -d                                -> Levanta toda la infraestructura
#   docker compose --profile jobs run --rm dbt build    -> Construye y valida Bronze/Silver/Gold
#   docker compose --profile jobs run --rm spark-submit -> Construye la OBT en Snowflake

x-snowflake-env: &snowflake-env
  SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
  SNOWFLAKE_USER: ${SNOWFLAKE_USER}
  SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
  SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
  SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
  SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-PSET2_DB}
  SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-ANALYTICS}

services:
  # ----------------------------------------------------------------- Kestra
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    volumes:
      - datos_postgres:/var/lib/postgresql
    networks: [nowcasting_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 5s
      timeout: 5s
      retries: 20

  kestra:
    image: kestra/kestra:v2.0.7
    user: "root"
    command: server standalone
    volumes:
      - datos_kestra:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./:/workspace
    environment:
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      ENV_SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-PSET2_DB}
      ENV_SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-ANALYTICS}
      ENV_MLFLOW_TRACKING_URI: http://mlflow:5000
      ENV_API_URL: http://api:8000
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              username: admin@kestra.io
              password: Admin1234
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:${KESTRA_PORT:-8080}/
    ports:
      - "${KESTRA_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nowcasting_net]

  # ------------------------------------------------------------------ Spark
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8081
    ports:
      - "8081:8081"
      - "7077:7077"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    networks: [nowcasting_net]

  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8082 --cores 2 --memory 2g
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    networks: [nowcasting_net]

  spark-submit:
    image: apache/spark:3.5.3
    profiles: ["jobs"]
    user: root
    depends_on:
      - spark-master
      - spark-worker
    working_dir: /opt/spark-apps
    volumes:
      - ./spark:/opt/spark-apps
    environment:
      <<: *snowflake-env
      SPARK_MASTER_URL: spark://spark-master:7077
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.driver.host=$$(hostname -i)
        --conf spark.jars.ivy=/tmp/.ivy2
        --packages net.snowflake:spark-snowflake_2.12:3.2.3-spark_3.5
        /opt/spark-apps/build_obt.py
    networks: [nowcasting_net]

  # -------------------------------------------------------------------- dbt
  dbt:
    image: ghcr.io/dbt-labs/dbt-snowflake:1.9.latest
    profiles: ["jobs"]
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
    environment:
      <<: *snowflake-env
      DBT_PROFILES_DIR: /usr/app
    entrypoint: ["dbt"]
    command: ["--version"]
    networks: [nowcasting_net]

  # ----------------------------------------------------------------- MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: nowcasting-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow/mlartifacts
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [nowcasting_net]

  # -------------------------------------------------- API de Predicción (PSet #4)
  api:
    image: ghcr.io/oedwinher/proyecto_final-api:${API_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: nowcasting-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *snowflake-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-nowcasting-f104-sri}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-nowcasting-f104-modelo}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      MODO_RESPALDO: ${MODO_RESPALDO:-false}
      TOKEN_ADMIN: ${TOKEN_ADMIN:-bce-coyuntura-2026}
      GUARDAR_SNOWFLAKE: ${GUARDAR_SNOWFLAKE:-true}
      PREDICCIONES_LOG_PATH: /app/logs/predicciones.jsonl
    volumes:
      - ./logs:/app/logs
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [nowcasting_net]

  # ---------------------------------------------- Tablero de Monitoreo (Streamlit)
  tablero:
    image: ghcr.io/oedwinher/proyecto_final-api:${API_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: nowcasting-tablero
    command: ["streamlit", "run", "tablero/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "${TABLERO_PORT:-8501}:8501"
    environment:
      <<: *snowflake-env
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./docs:/app/docs
      - ./tablero:/app/tablero
    depends_on:
      - api
    restart: unless-stopped
    networks: [nowcasting_net]

networks:
  nowcasting_net:
    driver: bridge

volumes:
  datos_postgres:
  datos_kestra:
